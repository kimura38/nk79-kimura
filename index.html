<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Trade+</title>
<style>
body{margin:0;font-family:system-ui;background:#f2f2f2}
#app{max-width:380px;margin:auto;padding:14px}
.box{background:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
button{padding:6px 10px;border:none;border-radius:6px;background:#06c755;color:#fff;margin:4px}
#coin{font-size:22px;font-weight:bold;display:inline-block;transition:.2s}
.pop{
  position:absolute;
  color:#06c755;
  animation:pop 0.8s forwards;
}
@keyframes pop{
  0%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-20px)}
}
.small{font-size:12px;color:#555}
</style>
</head>
<body>

<div id="app">
  <h2>🌱 Idle Trade+</h2>

  <div class="box">
    💰 コイン: <span id="coin">0</span><br>
    <span class="small">放置Lv: <b id="speedLv">1</b></span><br>
    <button onclick="upgrade()">⚡ スピード強化</button>
  </div>

  <div class="box">
    <b>ショップ（50種）</b>
    <div id="shop"></div>
  </div>

  <div class="box">
    <b>持ち物</b>
    <div id="items"></div>
  </div>

  <div class="box">
    <b>マーケット</b>
    <div id="market"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, update, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase */
const firebaseConfig={
  apiKey:"AIzaSyCQNNj6Ff39wECAI6i8n1f2NXstF2k7duo",
  databaseURL:"https://chat-99077-default-rtdb.firebaseio.com",
  projectId:"chat-99077"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* ユーザー */
let uid=localStorage.getItem("idle_uid");
if(!uid){
  uid=crypto.randomUUID();
  localStorage.setItem("idle_uid",uid);
}
const userRef=ref(db,"idleUsers/"+uid);

/* 初期化 */
const snap=await get(userRef);
if(!snap.exists()){
  set(userRef,{coin:0,items:{},speed:1,last:Date.now()});
}

/* 放置収入 */
function earn(amount){
  coin.textContent=Number(coin.textContent)+amount;
  coin.style.transform="scale(1.2)";
  setTimeout(()=>coin.style.transform="scale(1)",150);

  const p=document.createElement("div");
  p.className="pop";
  p.textContent="+"+amount;
  document.body.appendChild(p);
  p.style.left="50%";
  p.style.top="60px";
  setTimeout(()=>p.remove(),800);
}

/* オフライン分計算 */
const s0=await get(userRef);
const u0=s0.val();
const diff=Math.floor((Date.now()-u0.last)/1000);
const gain=diff*u0.speed;
if(gain>0){
  update(userRef,{coin:u0.coin+gain,last:Date.now()});
}

/* 定期収入 */
setInterval(async()=>{
  const s=await get(userRef);
  update(userRef,{
    coin:s.val().coin+s.val().speed,
    last:Date.now()
  });
},3000);

/* 表示 */
onValue(userRef,s=>{
  const u=s.val();
  coin.textContent=u.coin;
  speedLv.textContent=u.speed;
  items.innerHTML="";
  for(const k in u.items||{}){
    items.innerHTML+=`
      <div>${k} x${u.items[k]}
        <button onclick="sell('${k}')">売る</button>
      </div>`;
  }
});

/* ショップ（50種） */
const shopDiv=document.getElementById("shop");
for(let i=1;i<=50;i++){
  const price=i*2;
  shopDiv.innerHTML+=`
    <div>
      item${i} (${price})
      <button onclick="buy('item${i}',${price})">買う</button>
    </div>`;
}

/* 購入 */
window.buy=async(name,price)=>{
  const s=await get(userRef);
  if(s.val().coin<price) return;
  update(userRef,{
    coin:s.val().coin-price,
    [`items/${name}`]:(s.val().items?.[name]||0)+1
  });
};

/* 売る（即金） */
window.sell=async(name)=>{
  const price=Number(prompt("売値"));
  if(!price) return;

  const s=await get(userRef);
  update(userRef,{
    coin:s.val().coin+price,
    [`items/${name}`]:s.val().items[name]-1
  });

  push(ref(db,"market"),{name,price});
};

/* マーケット */
onValue(ref(db,"market"),s=>{
  market.innerHTML="";
  s.forEach(i=>{
    const d=i.val();
    market.innerHTML+=`
      <div>${d.name} (${d.price})
      <button onclick="remove(ref(db,'market/${i.key}'))">購入</button>
      </div>`;
  });
});

/* スピード強化 */
window.upgrade=async()=>{
  const s=await get(userRef);
  const cost=s.val().speed*50;
  if(s.val().coin<cost) return alert("コイン不足");
  update(userRef,{
    coin:s.val().coin-cost,
    speed:s.val().speed+1
  });
};
</script>

</body>
</html>
