<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Trade</title>
<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f2f2f2;
}
#app{
  max-width:360px;
  margin:auto;
  padding:16px;
}
.box{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}
button{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  background:#06c755;
  color:#fff;
  margin-top:6px;
}
.small{font-size:13px;color:#555}
</style>
</head>
<body>

<div id="app">
  <h2>🌱 Idle Trade</h2>

  <div class="box">
    💰 コイン: <b id="coin">0</b>
  </div>

  <div class="box">
    <b>ショップ</b><br>
    <button onclick="buy('apple',10)">🍎 りんご (10)</button>
  </div>

  <div class="box">
    <b>持ち物</b>
    <div id="items"></div>
  </div>

  <div class="box">
    <b>マーケット</b>
    <div id="market"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, update, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase */
const firebaseConfig={
  apiKey:"AIzaSyCQNNj6Ff39wECAI6i8n1f2NXstF2k7duo",
  databaseURL:"https://chat-99077-default-rtdb.firebaseio.com",
  projectId:"chat-99077"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* ユーザー */
let uid=localStorage.getItem("idle_uid");
if(!uid){
  uid=crypto.randomUUID();
  localStorage.setItem("idle_uid",uid);
}
const userRef=ref(db,"idleUsers/"+uid);

/* 初期化 */
const snap=await get(userRef);
if(!snap.exists()){
  set(userRef,{coin:0,items:{}});
}

/* 放置収入（5秒ごと +1） */
setInterval(async()=>{
  const s=await get(userRef);
  update(userRef,{coin:(s.val().coin||0)+1});
},5000);

/* 表示 */
onValue(userRef,s=>{
  const u=s.val();
  coin.textContent=u.coin||0;
  items.innerHTML="";
  for(const k in u.items||{}){
    items.innerHTML+=`
      <div>
        ${k} x${u.items[k]}
        <button onclick="sell('${k}')">売る</button>
      </div>`;
  }
});

/* 購入 */
window.buy=async(name,price)=>{
  const s=await get(userRef);
  if(s.val().coin<price) return alert("コイン不足");
  update(userRef,{
    coin:s.val().coin-price,
    [`items/${name}`]:(s.val().items?.[name]||0)+1
  });
};

/* 出品 */
window.sell=async(name)=>{
  const price=prompt("価格");
  if(!price) return;

  const s=await get(userRef);
  if(!s.val().items?.[name]) return;

  const itemRef=push(ref(db,"market"));
  set(itemRef,{
    seller:uid,
    name,
    price:Number(price)
  });

  update(userRef,{
    [`items/${name}`]:s.val().items[name]-1
  });
};

/* マーケット表示 */
onValue(ref(db,"market"),s=>{
  market.innerHTML="";
  s.forEach(i=>{
    const d=i.val();
    market.innerHTML+=`
      <div>
        ${d.name} (${d.price})
        <button onclick="buyItem('${i.key}','${d.seller}',${d.price},'${d.name}')">
          購入
        </button>
      </div>`;
  });
});

/* トレード成立 */
window.buyItem=async(id,seller,price,name)=>{
  const s=await get(userRef);
  if(s.val().coin<price) return alert("コイン不足");

  update(userRef,{
    coin:s.val().coin-price,
    [`items/${name}`]:(s.val().items?.[name]||0)+1
  });

  const sellerRef=ref(db,"idleUsers/"+seller);
  const ss=await get(sellerRef);
  update(sellerRef,{coin:(ss.val().coin||0)+price});

  remove(ref(db,"market/"+id));
};
</script>

</body>
</html>
