<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Battle</title>
<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
#app{
  background:#fff;
  width:320px;
  padding:16px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
  text-align:center;
}
button{
  padding:10px 16px;
  margin:6px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#06c755;
  color:#fff;
}
button:disabled{
  background:#aaa;
}
.small{font-size:13px;color:#555}
</style>
</head>
<body>

<div id="app">
  <h2>数字バトル</h2>
  <div id="status">接続中...</div>
  <h1 id="number">0</h1>

  <div id="buttons">
    <button onclick="play(1)">+1</button>
    <button onclick="play(2)">+2</button>
    <button onclick="play(3)">+3</button>
  </div>

  <p class="small" id="turn"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase設定（そのまま） */
const firebaseConfig={
  apiKey:"AIzaSyCQNNj6Ff39wECAI6i8n1f2NXstF2k7duo",
  databaseURL:"https://chat-99077-default-rtdb.firebaseio.com",
  projectId:"chat-99077"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* ユーザー */
let uid=localStorage.getItem("game_uid");
if(!uid){
  uid=crypto.randomUUID();
  localStorage.setItem("game_uid",uid);
}

/* ゲームID（固定部屋） */
const gameId="number_game_1";
const gameRef=ref(db,"games/"+gameId);

/* 初期化 */
const snap=await get(gameRef);
if(!snap.exists()){
  set(gameRef,{
    number:0,
    turn:uid,
    players:{[uid]:true},
    status:"waiting",
    winner:null
  });
}else{
  update(gameRef,{[`players/${uid}`]:true});
}

/* 監視 */
onValue(gameRef,s=>{
  const g=s.val();
  if(!g) return;

  number.textContent=g.number;

  if(g.winner){
    status.textContent="勝者が決まりました！";
    turn.textContent=g.winner===uid?"🎉 あなたの勝ち！":"😢 負け";
    document.querySelectorAll("button").forEach(b=>b.disabled=true);
    return;
  }

  const isMyTurn=g.turn===uid;
  status.textContent=isMyTurn?"あなたの番":"相手の番";
  turn.textContent="現在の数："+g.number;

  document.querySelectorAll("button").forEach(b=>b.disabled=!isMyTurn);
});

/* 操作 */
window.play=async(n)=>{
  const snap=await get(gameRef);
  const g=snap.val();
  if(g.turn!==uid||g.winner) return;

  const next=g.number+n;
  const players=Object.keys(g.players);
  const nextTurn=players.find(p=>p!==uid);

  if(next>=20){
    update(gameRef,{
      number:20,
      winner:uid
    });
  }else{
    update(gameRef,{
      number:next,
      turn:nextTurn
    });
  }
};
</script>

</body>
</html>
